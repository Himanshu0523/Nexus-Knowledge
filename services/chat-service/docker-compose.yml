version: '3.8'

services:
  postgres:
    image: postgres:14
    environment:
      POSTGRES_DB: chatbot_db
      POSTGRES_USER: chatbot
      POSTGRES_PASSWORD: chatbot_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - chatbot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - chatbot-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DEBUG=true
      - CHAT_SERVICE_URL=http://chat-service:8001
    depends_on:
      - chat-service
    networks:
      - chatbot-network

  chat-service:
    build:
      context: ./services/chat-service
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://chatbot:chatbot_password@postgres:5432/chatbot_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LLM_PROVIDER=mock
    depends_on:
      - postgres
      - redis
    networks:
      - chatbot-network
    volumes:
      - ./services/chat-service/src:/app/src

volumes:
  postgres_data:
  redis_data:

networks:
  chatbot-network:
    driver: bridge