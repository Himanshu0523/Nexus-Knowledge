events {
    worker_connections 1024;
}

http {
    upstream api_gateway_backend {
        least_conn;
        server api-gateway:8000 max_fails=2 fail_timeout=5s;
        server api-gateway-2:8000 max_fails=2 fail_timeout=5s;
        server api-gateway-3:8000 max_fails=2 fail_timeout=5s backup;
        keepalive 32;
    }

    upstream chat_service_backend {
        least_conn;
        server chat-service:8001 max_fails=2 fail_timeout=5s;
        server chat-service-2:8001 max_fails=2 fail_timeout=5s;
        server chat-service-3:8001 max_fails=2 fail_timeout=5s backup;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost nexus-ai.local;

        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 10s;

        # API Gateway Route
        location /api/ {
            proxy_pass http://api_gateway_backend/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Direct Internal Chat Service Load Balanced Route
        location /internal/chat/ {
            proxy_pass http://chat_service_backend/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

        # Load Balancer Healthcheck Endpoint
        location /lb-health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"UP","load_balancer":"nginx-ha"}';
        }
    }
}
