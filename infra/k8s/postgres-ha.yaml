apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-primary
  namespace: nexus-ai
spec:
  serviceName: postgres-primary
  replicas: 1
  selector:
    matchLabels:
      app: postgres-primary
  template:
    metadata:
      labels:
        app: postgres-primary
    spec:
      containers:
        - name: postgres
          image: postgres:14-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: chatbot_db
            - name: POSTGRES_USER
              value: chatbot
            - name: POSTGRES_PASSWORD
              value: chatbot_password
          volumeMounts:
            - name: postgres-primary-storage
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-primary-storage
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-primary
  namespace: nexus-ai
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres-primary
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-replica
  namespace: nexus-ai
spec:
  serviceName: postgres-replica
  replicas: 2
  selector:
    matchLabels:
      app: postgres-replica
  template:
    metadata:
      labels:
        app: postgres-replica
    spec:
      containers:
        - name: postgres-replica
          image: postgres:14-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_MASTER_SERVICE
              value: postgres-primary
            - name: POSTGRES_USER
              value: chatbot
            - name: POSTGRES_PASSWORD
              value: chatbot_password
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-replica-service
  namespace: nexus-ai
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres-replica
