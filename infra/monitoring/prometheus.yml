global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "api-gateway"
    static_configs:
      - targets: ["api-gateway:8000"]

  - job_name: "chat-service"
    static_configs:
      - targets: ["chat-service:8001"]

  - job_name: "kafka"
    static_configs:
      - targets: ["kafka:9092"]
